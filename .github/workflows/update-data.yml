name: Update Historical Data

on:
  schedule:
    - cron: '0 6 1 * *'   # 1. dzień miesiąca 06:00 UTC
  workflow_dispatch:       # ręczne uruchomienie z GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest market data
        run: |
          pip install yfinance --quiet
          python scripts/fetch_data.py

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gem/historical_data.json
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "chore: update historical data $(date -u '+%Y-%m-%d')"
            git push
          fi
