<body>
<div id="root"></div>
<script src="components/gemEngine.js"></script>
<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/QRData.jsx"></script>
<script type="text/babel" src="components/QRLayout.jsx"></script>
<script type="text/babel" src="components/gemSummary.jsx"></script>
<script type="text/babel">
function EquitySpark({ values }){
  const w = 240, h = 36;
  const min = Math.min(...values), max = Math.max(...values);
  const path = values.map((v, i) => `${i?'L':'M'}${(i/(values.length-1)*w).toFixed(1)},${((1-(v-min)/(max-min||1))*h).toFixed(1)}`).join(' ');
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" className="w-full h-full" role="img" aria-label="Wartość portfela GEM w czasie">
      <path d={path} stroke="var(--accent)" strokeWidth="1.4" fill="none" vectorEffect="non-scaling-stroke"/>
    </svg>
  );
}

function StrategiesPage(){
  const { summary, failed } = window.useGemSummary();

  return (
    <>
      <QRTopNav active="strategies"/>

      <section className="border-b hairline">
        <div className="k-wrap k-wide pt-14 pb-10">
          <h1 className="k-h1">Strategie</h1>
          <p className="text-[15px] text-[var(--ink-dim)] mt-5 max-w-[60ch] leading-relaxed">
            Każda ma backtest w symulatorze, a dane rynkowe odświeżają się co miesiąc.
          </p>
        </div>
      </section>

      <section className="k-wrap k-wide py-10">
        {summary && (
          <p className="text-[13px] text-[var(--ink-dim)] mb-6 leading-relaxed">
            Ustawienia domyślne, {summary.from} – {summary.to}, bez prowizji i spreadu. CAGR jest przybliżony. Pełne założenia są na stronie strategii.
          </p>
        )}
        {failed && (
          <p className="text-[13px] text-[var(--ink-dim)] mb-6">Nie udało się wczytać danych rynkowych, więc wyników nie można policzyć.</p>
        )}

        {/* table-card list */}
        <div className="border hairline rounded-sm bg-[var(--bg-1)] overflow-hidden">
          {/* head */}
          <div className="hidden md:grid grid-cols-[1.6fr_2fr_180px_90px_90px_90px] gap-4 px-5 py-3 border-b hairline text-[13px] mono text-[var(--ink-faint)]">
            <div>strategia</div>
            <div>opis</div>
            <div>krzywa</div>
            <div className="text-right">CAGR</div>
            <div className="text-right">Max DD</div>
            <div className="text-right">Sharpe</div>
          </div>

          {QRData.strategies.map(s => {
            const kpi = s.id === 'gem' ? summary?.gem : null;
            return (
              <a key={s.id} href={s.href}
                 className="grid grid-cols-1 md:grid-cols-[1.6fr_2fr_180px_90px_90px_90px] gap-4 px-5 py-5 items-center border-b hairline last:border-b-0 hover:bg-[var(--bg-2)]/40 transition group">
                <div>
                  <div className="text-[15px] tracking-[-0.01em] group-hover:text-[var(--accent)] transition">{s.name}</div>
                  <div className="mono text-[13px] text-[var(--ink-faint)] mt-1">{s.complexity} złożoność</div>
                </div>

                <div>
                  <p className="text-[13px] text-[var(--ink-dim)] leading-relaxed">{s.lede}</p>
                  <div className="mt-2 flex items-center gap-1.5 flex-wrap">
                    {s.assets.map(a => (
                      <span key={a} className="mono text-[13px] px-1.5 py-0.5 rounded bg-[var(--bg-2)] border hairline text-[var(--ink-mute)]">{a}</span>
                    ))}
                  </div>
                </div>

                <div className="h-9">
                  {kpi && <EquitySpark values={summary.curve}/>}
                </div>

                <div className="mono text-right tnum">
                  <div className="text-[16px] text-[var(--accent)]">{kpi ? `${kpi.cagr.toFixed(1)}%` : '—'}</div>
                  <div className="text-[13px] text-[var(--ink-faint)] mt-0.5">CAGR</div>
                </div>
                <div className="mono text-right tnum">
                  <div className="text-[16px] text-[var(--ink)]">{kpi ? `${kpi.maxDrawdown.toFixed(1)}%` : '—'}</div>
                  <div className="text-[13px] text-[var(--ink-faint)] mt-0.5">Max DD</div>
                </div>
                <div className="mono text-right tnum">
                  <div className="text-[16px] text-[var(--ink)]">{kpi ? kpi.sharpe.toFixed(2) : '—'}</div>
                  <div className="text-[13px] text-[var(--ink-faint)] mt-0.5">Sharpe</div>
                </div>
              </a>
            );
          })}
        </div>

        <div className="mt-6 mono text-[13px] text-[var(--ink-faint)] flex items-center gap-3 flex-wrap">
          <span>dane: Yahoo Finance</span><span>·</span>
          <span>obliczono w przeglądarce</span>
        </div>
      </section>

      <QRFooter/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<StrategiesPage />);
</script>
</body>
</html>
