<body class="min-h-screen">
<div id="root"></div>
<script src="components/gemEngine.js"></script>
<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/QRData.jsx"></script>
<script type="text/babel" src="components/QRLayout.jsx"></script>
<script type="text/babel" src="components/gemSummary.jsx"></script>
<script type="text/babel">
function NewsletterForm() {
  const [email, setEmail] = React.useState('');
  const [status, setStatus] = React.useState('idle'); // idle | sending | ok | err
  const [errMsg, setErrMsg] = React.useState('');

  async function handleSubmit(e) {
    e.preventDefault();
    setStatus('sending');
    try {
      const res = await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (data.ok) {
        setStatus('ok');
      } else {
        setErrMsg(data.error || 'Coś poszło nie tak.');
        setStatus('err');
      }
    } catch {
      setErrMsg('Brak połączenia. Spróbuj ponownie.');
      setStatus('err');
    }
  }

  if (status === 'ok') {
    return (
      <p className="text-[15px] text-[var(--ink-dim)] py-2.5">Zapisano. Sprawdź skrzynkę, wiadomość mogła trafić do spamu.</p>
    );
  }

  return (
    <form onSubmit={handleSubmit} className="flex flex-col gap-1.5">
      <label htmlFor="nl-email" className="block text-[13.5px] text-[var(--ink-dim)] mb-1">Twój e-mail</label>
      <div className="flex gap-2 flex-wrap">
        <input
          type="email"
          value={email}
          onChange={e => setEmail(e.target.value)}
          placeholder="ty@example.com"
          required
          id="nl-email"
          className="k-input flex-1 basis-[220px]"
        />
        <button
          type="submit"
          disabled={status === 'sending'}
          className="k-btn disabled:opacity-60 disabled:cursor-not-allowed"
        >
          {status === 'sending' ? 'Zapisuję…' : 'Zapisz się'}
        </button>
      </div>
      {status === 'err' && (
        <div className="text-[13px] text-[var(--bad)] mt-1">{errMsg}</div>
      )}
    </form>
  );
}

function fmtDate(iso){ return new Date(iso).toLocaleDateString('pl-PL', { day:'2-digit', month:'short', year:'numeric' }); }
const pct = v => v.toLocaleString('pl-PL', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';

function HomePage(){
  const articles = QRData.articles;
  const latest = articles[0];
  const { summary, failed } = window.useGemSummary();

  return (
    <>
      <QRTopNav active="home"/>
      <main className="k-wrap">
        <p className="pt-6 text-[19px] leading-[1.5] max-w-[36ch] text-[var(--ink-dim)]">
          <b className="font-semibold text-[var(--ink)]">Backtesty, koszty i strategie</b> sprawdzone na danych.
          Ile naprawdę zostaje po spreadzie, prowizji i podatku Belki.
        </p>

        <a href={latest.href} className="block mt-10 pt-7 k-rule group">
          <div className="k-meta flex flex-wrap gap-x-4">
            <span>{latest.cat}</span><span>{fmtDate(latest.date)}</span><span>{latest.readMin} min czytania</span>
          </div>
          <h1 className="k-h2 mt-3 group-hover:underline decoration-2 underline-offset-[5px]">{latest.title}</h1>
          <p className="mt-4 text-[16px] leading-relaxed text-[var(--ink-dim)] max-w-[60ch]">{latest.lede}</p>
          <span className="inline-block mt-5 k-link text-[14.5px]">Czytaj wpis</span>
        </a>

        <section className="mt-16" aria-labelledby="h-wpisy">
          <div className="k-rule pt-3 pb-1 flex items-baseline justify-between gap-4 flex-wrap">
            <h2 id="h-wpisy" className="k-h3">Wszystkie wpisy</h2>
            <span className="k-meta">{articles.length} {articles.length === 1 ? 'wpis' : 'wpisy'}</span>
          </div>
          {articles.map(a => (
            <a key={a.id} href={a.href} className="k-post">
              <span className="k-meta">{fmtDate(a.date)}</span>
              <span>
                <span className="k-post-t block font-semibold text-[17px] leading-snug">{a.title}</span>
                <span className="block text-[14px] text-[var(--ink-mute)] mt-1">{a.cat} · {a.readMin} min</span>
              </span>
              <span></span>
            </a>
          ))}
        </section>

        <section className="mt-16" aria-labelledby="h-narzedzia">
          <div className="k-rule pt-3 pb-1"><h2 id="h-narzedzia" className="k-h3">Narzędzia</h2></div>
          <a href="gem.html" className="mt-4 grid gap-6 sm:grid-cols-2 bg-[var(--bg-2)] p-6 group">
            <div>
              <h3 className="display-font text-[22px] group-hover:underline decoration-2 underline-offset-4">Symulator GEM</h3>
              <p className="mt-2 text-[15px] text-[var(--ink-dim)] leading-relaxed">
                Global Equity Momentum z polskim podatkiem Belki, opcją IKE i kosztami, które ustawiasz sam.
              </p>
              <span className="inline-block mt-4 k-link text-[14.5px]">Otwórz symulator</span>
            </div>
            <div className="self-center">
              {failed && <p className="text-[14px] text-[var(--ink-dim)]">Nie udało się wczytać wyników.</p>}
              {summary && (
                <>
                  <div className="grid grid-cols-3 gap-3">
                    <div><div className="k-meta">CAGR</div><div className="mono text-[20px] mt-1">{pct(summary.gem.cagr)}</div></div>
                    <div><div className="k-meta">Maks. spadek</div><div className="mono text-[20px] mt-1">{pct(summary.gem.maxDrawdown)}</div></div>
                    <div><div className="k-meta">Sharpe</div><div className="mono text-[20px] mt-1">{summary.gem.sharpe.toLocaleString('pl-PL', { minimumFractionDigits: 2 })}</div></div>
                  </div>
                  <p className="mt-3 text-[13.5px] text-[var(--ink-mute)] leading-relaxed">
                    Ustawienia domyślne, {summary.from} – {summary.to}, bez prowizji, benchmark {summary.benchLabel}.
                  </p>
                </>
              )}
            </div>
          </a>
        </section>

        <section id="newsletter" className="mt-16 k-rule pt-5 grid gap-3" aria-labelledby="h-nl">
          <h2 id="h-nl" className="display-font text-[20px]">Nowy wpis, jeden e-mail.</h2>
          <p className="text-[15px] text-[var(--ink-dim)] max-w-[52ch]">Dostajesz wiadomość tylko wtedy, gdy pojawi się nowa analiza. Wypisujesz się jednym kliknięciem.</p>
          <NewsletterForm/>
        </section>
      </main>
      <QRFooter/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HomePage />);
</script>

  <input type="email" name="email" />
  <input type="tel"   name="telefon" />
