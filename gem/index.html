<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kwantowo.pl — finanse, dane i kod</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="qr.css"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen">
<div id="root"></div>
<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/QRData.jsx"></script>
<script type="text/babel" src="components/QRLayout.jsx"></script>
<script type="text/babel">
function fmtDate(iso){ return new Date(iso).toLocaleDateString('pl-PL', { day:'2-digit', month:'short', year:'numeric' }); }

function StatBlock({ label, value, suffix, sub }){
  return (
    <div>
      <div className="text-[10.5px] mono uppercase tracking-[.14em] text-[var(--ink-mute)]">{label}</div>
      <div className="display text-[40px] tnum mt-1.5">{value}{suffix && <span className="text-[18px] text-[var(--ink-mute)]"> {suffix}</span>}</div>
      <div className="mono text-[10.5px] text-[var(--ink-faint)] mt-0.5">{sub}</div>
    </div>
  );
}

function HomePage(){
  const featured = QRData.articles.find(a => a.featured);
  const recent = QRData.articles.filter(a => !a.featured).slice(0, 4);
  const top3 = QRData.strategies.slice(0, 3);

  return (
    <>
      <QRTopNav active="home"/>

      {/* HERO */}
      <section className="relative overflow-hidden border-b hairline">
        <div className="absolute inset-0 grid-dots opacity-50 pointer-events-none"></div>
        <div className="relative max-w-[1400px] mx-auto px-6 pt-16 lg:pt-24 pb-12 grid grid-cols-1 lg:grid-cols-12 gap-10">
          <div className="lg:col-span-8">
            <div className="flex items-center gap-2 text-[10.5px] mono uppercase tracking-[.18em] text-[var(--ink-faint)] mb-4">
              <span className="live-dot inline-block w-1.5 h-1.5 rounded-full bg-[var(--accent)]"></span>
              quant road · est. 2019
              <span>·</span>
              <span>{QRData.author.posts} artykułów</span>
              <span>·</span>
              <span>{QRData.newsletter.subscribers.toLocaleString('pl-PL')} czytelników</span>
            </div>

            <h1 className="serif text-[56px] md:text-[88px] leading-[0.95] tracking-[-0.02em]">
              Inwestowanie<br/>
              jak <span className="italic text-[var(--accent)]">spreadsheet</span>,<br/>
              nie jak <span className="italic text-[var(--ink-mute)]">poker.</span>
            </h1>

            <p className="text-[16px] md:text-[18px] text-[var(--ink-dim)] mt-7 max-w-[60ch] leading-relaxed">
              Niezależny blog o ilościowym podejściu do rynków. Strategie momentum,
              alokacja taktyczna, podatki i koszty — wszystko liczone od kuchni, na realnych
              danych, dla polskiego inwestora.
            </p>

            <div className="mt-8 flex items-center gap-3 flex-wrap">
              <a href="gem.html" className="px-4 py-2.5 rounded-md bg-[var(--accent)] text-[#04261b] text-[13.5px] font-semibold hover:brightness-110 transition">
                Otwórz symulator GEM →
              </a>
              <a href="artykuly.html" className="px-4 py-2.5 rounded-md bg-[var(--bg-2)] border hairline text-[13.5px] text-[var(--ink-dim)] hover:text-[var(--ink)] transition">
                Wszystkie artykuły
              </a>
              <a href="#newsletter" className="text-[13px] text-[var(--ink-mute)] hover:text-[var(--ink)] transition px-2">
                Newsletter →
              </a>
            </div>
          </div>

          <div className="lg:col-span-4 lg:pl-6 lg:border-l hairline">
            <div className="text-[10.5px] mono uppercase tracking-[.14em] text-[var(--ink-faint)] mb-4">na blogu</div>
            <div className="grid grid-cols-2 gap-x-6 gap-y-7">
              <StatBlock label="Strategie live" value="6" sub="śledzonych co miesiąc" />
              <StatBlock label="Lat backtestu" value="25" sub="2000 → 2025" />
              <StatBlock label="Średni CAGR top-3" value="11.6" suffix="%" sub="po podatkach" />
              <StatBlock label="Czytelnicy" value="3.8" suffix="k" sub="newsletter tygodniowy" />
            </div>
          </div>
        </div>
      </section>

      {/* FEATURED */}
      <section className="border-b hairline">
        <div className="max-w-[1400px] mx-auto px-6 py-14 grid grid-cols-1 lg:grid-cols-12 gap-8">
          <div className="lg:col-span-7">
            <div className="text-[10.5px] mono uppercase tracking-[.18em] text-[var(--ink-faint)] mb-4">artykuł tygodnia</div>
            <a href="#" className="block group">
              <div className="aspect-[16/10] rounded-xl border hairline bg-gradient-to-br from-[var(--bg-2)] to-[var(--bg-1)] relative overflow-hidden mb-6">
                <div className="absolute inset-0 grid-dots opacity-50"></div>
                <svg className="absolute inset-0 w-full h-full" viewBox="0 0 100 60" preserveAspectRatio="none">
                  <path d="M0,40 L8,38 L16,32 L24,28 L32,30 L40,22 L48,24 L56,18 L64,20 L72,12 L80,14 L88,8 L100,6"
                        stroke="var(--accent)" strokeWidth="0.4" fill="none" vectorEffect="non-scaling-stroke"/>
                  <path d="M0,40 L8,42 L16,44 L24,40 L32,46 L40,42 L48,48 L56,44 L64,50 L72,46 L80,52 L88,48 L100,54"
                        stroke="var(--blue)" strokeWidth="0.3" fill="none" opacity="0.6" vectorEffect="non-scaling-stroke"/>
                </svg>
                <div className="absolute top-4 left-4 badge badge-buy">{featured.cat}</div>
              </div>
              <div className="flex items-center gap-3 text-[10.5px] mono uppercase tracking-[.14em] text-[var(--ink-faint)] mb-3">
                <span>{fmtDate(featured.date)}</span><span>·</span>
                <span>{featured.readMin} min czytania</span>
              </div>
              <h2 className="serif text-[36px] md:text-[44px] leading-[1.05] tracking-[-0.01em] group-hover:text-[var(--accent)] transition">
                {featured.title}
              </h2>
              <p className="text-[14.5px] text-[var(--ink-dim)] mt-4 max-w-[60ch] leading-relaxed">{featured.lede}</p>
              <div className="mt-5 flex items-center gap-2">
                {featured.tags.map(t => (
                  <span key={t} className="px-2 py-0.5 rounded text-[11px] mono bg-[var(--bg-2)] border hairline text-[var(--ink-mute)]">#{t}</span>
                ))}
              </div>
            </a>
          </div>

          <aside className="lg:col-span-5 lg:pl-8 lg:border-l hairline">
            <div className="text-[10.5px] mono uppercase tracking-[.18em] text-[var(--ink-faint)] mb-4">ostatnio</div>
            <ul className="space-y-5">
              {recent.map(a => (
                <li key={a.id} className="group">
                  <a href="#" className="block">
                    <div className="flex items-center gap-3 text-[10.5px] mono uppercase tracking-[.14em] text-[var(--ink-faint)] mb-1.5">
                      <span className="text-[var(--accent)]">{a.cat}</span>
                      <span>·</span>
                      <span>{fmtDate(a.date)}</span>
                      <span>·</span>
                      <span>{a.readMin} min</span>
                    </div>
                    <h3 className="text-[17px] tracking-[-0.01em] leading-[1.25] group-hover:text-[var(--accent)] transition">{a.title}</h3>
                    <p className="text-[12.5px] text-[var(--ink-mute)] mt-1.5 leading-relaxed line-clamp-2">{a.lede}</p>
                  </a>
                </li>
              ))}
            </ul>
            <a href="artykuly.html" className="mt-6 inline-flex items-center gap-2 text-[12.5px] mono uppercase tracking-[.14em] text-[var(--ink-mute)] hover:text-[var(--accent)] transition">
              Wszystkie {QRData.articles.length}+ artykułów <span>→</span>
            </a>
          </aside>
        </div>
      </section>

      {/* STRATEGIES */}
      <section className="border-b hairline">
        <div className="max-w-[1400px] mx-auto px-6 py-14">
          <div className="flex items-end justify-between mb-8 flex-wrap gap-4">
            <div>
              <div className="text-[10.5px] mono uppercase tracking-[.18em] text-[var(--ink-faint)] mb-2">strategie</div>
              <h2 className="serif text-[36px] tracking-[-0.01em] leading-tight">Co właściwie tu liczę.</h2>
              <p className="text-[13.5px] text-[var(--ink-mute)] mt-2 max-w-[56ch] leading-relaxed">
                Każda strategia ma własny zestaw danych, kod backtestu i powtarzalny sygnał. Nic na słowo — wszystko sprawdzalne.
              </p>
            </div>
            <a href="strategie.html" className="text-[13px] mono uppercase tracking-[.14em] text-[var(--ink-mute)] hover:text-[var(--accent)] transition">
              Cały katalog →
            </a>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            {top3.map(s => (
              <a key={s.id} href={s.id === 'gem' ? 'gem.html' : '#'} className="group border hairline rounded-xl bg-[var(--bg-1)] p-5 hover:border-[var(--line-2)] transition flex flex-col">
                <div className="flex items-start justify-between mb-3">
                  <div className={`badge ${s.status === 'live' ? 'badge-buy' : 'badge-pay'}`}>{s.status}</div>
                  <div className="mono text-[10.5px] text-[var(--ink-faint)] tnum">od {s.since}</div>
                </div>
                <h3 className="text-[17px] tracking-[-0.01em] leading-snug group-hover:text-[var(--accent)] transition">{s.name}</h3>
                <p className="text-[12.5px] text-[var(--ink-mute)] mt-2 leading-relaxed flex-1">{s.lede}</p>
                <div className="grid grid-cols-3 gap-2 mt-5 pt-4 border-t hairline">
                  <div>
                    <div className="text-[9.5px] mono uppercase tracking-[.14em] text-[var(--ink-faint)]">CAGR</div>
                    <div className="mono text-[14px] tnum text-[var(--accent)] mt-0.5">{s.cagr.toFixed(1)}%</div>
                  </div>
                  <div>
                    <div className="text-[9.5px] mono uppercase tracking-[.14em] text-[var(--ink-faint)]">Max DD</div>
                    <div className="mono text-[14px] tnum text-[var(--ink)] mt-0.5">{s.dd.toFixed(1)}%</div>
                  </div>
                  <div>
                    <div className="text-[9.5px] mono uppercase tracking-[.14em] text-[var(--ink-faint)]">Sharpe</div>
                    <div className="mono text-[14px] tnum text-[var(--ink)] mt-0.5">{s.sharpe.toFixed(2)}</div>
                  </div>
                </div>
              </a>
            ))}
          </div>
        </div>
      </section>

      {/* NEWSLETTER */}
      <section id="newsletter" className="border-b hairline">
        <div className="max-w-[1400px] mx-auto px-6 py-16 grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
          <div className="lg:col-span-7">
            <div className="text-[10.5px] mono uppercase tracking-[.18em] text-[var(--ink-faint)] mb-3">newsletter · piątek 8:00</div>
            <h2 className="serif text-[44px] tracking-[-0.02em] leading-tight">
              Jeden e-mail. <span className="italic text-[var(--accent)]">Zero szumu.</span>
            </h2>
            <p className="text-[14.5px] text-[var(--ink-dim)] mt-4 max-w-[60ch] leading-relaxed">
              Co piątek krótkie podsumowanie: nowe artykuły, sygnały śledzonych strategii w tym tygodniu,
              jeden wykres tygodnia. Bez clickbaitu, bez „premium content", bez sponsorów.
            </p>
          </div>
          <form className="lg:col-span-5 lg:pl-8 lg:border-l hairline" onSubmit={e => e.preventDefault()}>
            <label className="block text-[12px] text-[var(--ink-dim)] mb-2">Twój e-mail</label>
            <div className="flex gap-2">
              <input type="email" placeholder="ty@example.com"
                     className="flex-1 bg-[var(--bg-2)] border hairline rounded-md px-3 py-2.5 text-[14px] mono outline-none focus:border-[var(--accent-line)]"/>
              <button className="px-4 py-2.5 rounded-md bg-[var(--accent)] text-[#04261b] text-[13px] font-semibold hover:brightness-110 transition">
                Zapisz się
              </button>
            </div>
            <div className="mt-3 mono text-[10.5px] text-[var(--ink-faint)] uppercase tracking-[.14em]">
              {QRData.newsletter.subscribers.toLocaleString('pl-PL')} osób · archiwum {QRData.newsletter.archive} numerów · można wypisać jednym klikiem
            </div>
          </form>
        </div>
      </section>

      <QRFooter/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HomePage />);
</script>
</body>
</html>
